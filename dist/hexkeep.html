<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hexkeep</title>
<style>
html,body{margin:0;height:100%;background:#0b0e14;color:#e8e6df;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#hud{display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;padding:6px 10px;background:linear-gradient(#1d2331,#141923);border-bottom:1px solid #2f3850;box-shadow:0 2px 8px #0008;z-index:3}
.logo{font-weight:800;letter-spacing:2px;color:#f1d98a;text-shadow:0 1px 0 #000}
.rs{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 4px;border-radius:12px;background:#0b0e1488;border:1px solid #2a3248}
.rs b{font-weight:700;min-width:12px;font-variant-numeric:tabular-nums}
.rs img{display:block}
.rs .lb{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.g{color:#f6d24f}.w{color:#d9a25c}.s{color:#c3cad6}.h{color:#ff8a7a}.c{color:#c9a0ff}.wvc{color:#cfe0ff}
button{background:linear-gradient(#3d4a70,#2a3452);color:#eee;border:1px solid #5a6a9a;border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff26,0 2px 4px #0006;transition:filter .12s}
button:hover:not(:disabled){filter:brightness(1.18)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.42;cursor:default}
button.go{background:linear-gradient(#4a9a4a,#2e6e34);border-color:#7ccc7c;font-weight:700;text-shadow:0 1px 0 #0006}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cbtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:4}
#cbtns button{padding:4px 10px;font-size:12px;opacity:.92}
#vb.on{border-color:#f1c84b;box-shadow:0 0 8px #f1c84b99}
#legend{position:absolute;right:8px;bottom:42px;display:none;flex-direction:column;gap:3px;z-index:4;background:#0b0e14dd;border:1px solid #2a3248;border-radius:10px;padding:6px 10px;font-size:12px}
#legend.on{display:flex}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:12px;height:12px;border-radius:3px;border:2px solid;box-sizing:border-box}
#hint{padding:6px 10px;background:linear-gradient(#141923,#10141c);font-size:13px;color:#aab;border-top:1px solid #2a3040;min-height:18px}
#menu{position:absolute;display:none;background:linear-gradient(#222a3c,#171c29);border:1px solid #5a6690;border-radius:12px;padding:7px;z-index:5;min-width:236px;box-shadow:0 8px 24px #000c}
#menu button{display:block;width:100%;text-align:left;margin:3px 0}
#menu .t{font-size:12px;color:#b4bcd0;padding:2px 4px}
#menu .mi{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px}
#menu .mi .ib{flex:none;width:40px;height:40px;border-radius:8px;background:radial-gradient(#3a4560,#1a2030);border:1px solid #3a4560;display:flex;align-items:center;justify-content:center;overflow:hidden}
#menu .mi .ib img{width:40px;height:40px;display:block}
#menu .mi .tx{flex:1;min-width:0;line-height:1.15}
#menu .mi .tx small{display:block;font-size:11px;color:#8fd88f}
#menu .mi .tx small.dm{color:#9aa}
.cost{display:inline-flex;gap:6px;align-items:center;flex:none;font-size:12px;font-weight:700}
.cost span{display:inline-flex;align-items:center;gap:2px}
.cost span.no{color:#ff7a6b}
.cost img{display:block}
.fr{font-size:12px;font-weight:800;color:#8fe08f}
@media(max-width:700px){.rs .lb{display:none}}
@media(max-width:520px){#hud{gap:4px 6px;padding:5px 6px;font-size:13px}#hud button{padding:5px 8px}.logo{display:none}.rs{padding:2px 6px 2px 3px}}
button.pulse{border-color:#f1c84b;box-shadow:0 0 10px #f1c84bbb,inset 0 1px 0 #ffffff26}
#tech{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#1b2236f6,#0a0d14f6 70%);display:none;z-index:8;overflow-y:auto;padding:8px 10px 16px;box-sizing:border-box;touch-action:pan-y}
#tech .in{max-width:800px;margin:0 auto}
#tech .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#tech h2{margin:0;font-size:18px;letter-spacing:1px;color:#f1d98a}
#tech .pts{display:inline-flex;align-items:center;gap:5px;color:#ffe27a;font-weight:700;background:#0008;border:1px solid #6a5a20;border-radius:14px;padding:3px 12px 3px 6px}
.tree{position:relative;padding-top:4px}
.root{width:46px;height:46px;margin:0 auto;border-radius:50%;background:radial-gradient(#4a4230,#1e1a12);border:2px solid #f1c84b;box-shadow:0 0 14px #f1c84b66;display:flex;align-items:center;justify-content:center;position:relative}
.root img{width:34px;height:34px}
.root::after{content:'';position:absolute;left:50%;top:100%;width:3px;height:12px;margin-left:-1.5px;background:#f1c84b;box-shadow:0 0 6px #f1c84b}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;padding-top:26px}
.cols::before{content:'';position:absolute;top:12px;left:16.66%;right:16.66%;height:3px;border-radius:2px;background:#f1c84b;box-shadow:0 0 8px #f1c84baa}
.col{position:relative;display:flex;flex-direction:column;align-items:stretch;--bc:#f1c84b}
.col::before{content:'';position:absolute;left:50%;top:-14px;width:3px;height:14px;margin-left:-1.5px;background:#f1c84b;box-shadow:0 0 6px #f1c84b}
.col.def{--bc:#ef5b50}.col.vis{--bc:#4aa8f2}
.bh{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--bc);padding:5px 4px;border-radius:10px;background:#0009;border:1px solid var(--bc);margin-bottom:0}
.bh img{width:20px;height:20px}
.ln{width:4px;height:18px;margin:0 auto;background:#2a3042;border-radius:2px}
.ln.on{background:var(--bc);box-shadow:0 0 8px var(--bc)}
#tech .nd{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;box-sizing:border-box;text-align:center;margin:0;padding:8px 6px 8px;font-size:11px;line-height:1.2;border-radius:14px;background:linear-gradient(#232b40,#161b29);border:2px solid color-mix(in srgb,var(--bc) 45%,#222);color:#cfd4e2;box-shadow:0 2px 6px #0008}
#tech .nd .ni{position:relative;width:46px;height:46px;border-radius:50%;background:radial-gradient(#2e3750,#10131c);border:2px solid var(--bc);display:flex;align-items:center;justify-content:center}
#tech .nd .ni img{width:32px;height:32px;display:block}
#tech .nd .nn{font-weight:800;font-size:12px;color:#fff}
#tech .nd .nx{color:#aab2c6;font-size:10.5px;min-height:3.6em}
#tech .nd .cs{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px;border-radius:10px;padding:2px 8px;background:#0008;color:#ffe27a}
#tech .nd .cs img{width:13px;height:13px}
#tech .nd .bd{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;display:none;align-items:center;justify-content:center}
#tech .nd .bd svg{width:12px;height:12px}
#tech .nd:disabled{opacity:1}
#tech .nd.own{background:linear-gradient(color-mix(in srgb,var(--bc) 80%,#fff 0%),color-mix(in srgb,var(--bc) 50%,#000));border-color:#fff8;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--bc) 60%,transparent)}
#tech .nd.own .nx{color:#fffe}
#tech .nd.own .ni{background:radial-gradient(#ffffff55,#00000033);border-color:#fff}
#tech .nd.own .cs{color:#fff;background:#0005}
#tech .nd.own .bd{display:flex;background:#2fbf5f;border:2px solid #fff}
#tech .nd.av{border-color:var(--bc);animation:glw 1.4s ease-in-out infinite}
#tech .nd.av .ni{box-shadow:0 0 10px var(--bc)}
@keyframes glw{0%,100%{box-shadow:0 0 6px var(--bc),0 2px 6px #0008}50%{box-shadow:0 0 18px var(--bc),0 0 4px var(--bc),0 2px 6px #0008}}
#tech .nd.poor{opacity:.9}
#tech .nd.poor .cs{color:#ff8a7a}
#tech .nd.lock{opacity:.5;filter:grayscale(.7);border-color:#2a3042;border-style:dashed}
#tech .nd.lock .ni{border-color:#3a4258}
#tech .nd.lock .bd{display:flex;background:#3a4258;border:2px solid #6a7490}
#tech .nt{font-size:12px;color:#8a92a8;margin:12px 0 4px;text-align:center}
@media(min-width:700px){#tech .in{max-width:720px}#tech .nd{padding:7px 10px;gap:3px;font-size:12.5px}#tech .nd .ni{width:48px;height:48px}#tech .nd .ni img{width:34px;height:34px}#tech .nd .nn{font-size:14px}#tech .nd .nx{font-size:12px;min-height:2.4em}#tech .nd .cs{font-size:12px}.ln{height:14px}.bh{font-size:13px}.root{width:46px;height:46px}.cols{padding-top:24px}#tech h2{font-size:20px}#tech .nt{margin:8px 0 0}}
#over{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center}
#over h1{margin:0;font-size:34px;color:#ff7a6b}

#menu .t.warn{color:#ff9a8a;max-width:236px}
#menu .mi .tx small.gv{color:#9fc4ff}
#hint{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
#hint .nx{display:inline-flex;align-items:center;gap:6px;color:#e8e6df;font-weight:600}
#hint .pv{display:inline-flex;align-items:center;gap:1px;background:#0008;border:1px solid #2a3248;border-radius:10px;padding:0 6px 0 2px}
#hint .pv.nw{border-color:#f1c84b;box-shadow:0 0 6px #f1c84b88}
#hint .bs{color:#ff6a5a;letter-spacing:1px}
#intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009;z-index:9;padding:16px;box-sizing:border-box}
#intro .card{max-width:420px;width:100%;background:linear-gradient(#232b40,#161b29);border:2px solid #f1c84b;border-radius:16px;padding:14px;box-shadow:0 10px 30px #000c}
#intro .ih{font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#f1d98a;margin-bottom:8px}
#intro .en{display:flex;gap:12px;align-items:center;margin:8px 0}
#intro .ei{flex:none;width:72px;height:72px;border-radius:12px;background:radial-gradient(#4a5370,#1a2030);display:flex;align-items:center;justify-content:center}
#intro .en b{font-size:16px;color:#fff}
#intro .en p{margin:3px 0;color:#c8cede;font-size:13px}
#intro .ct span{color:#8fe08f;font-weight:700}
#intro button{width:100%;margin-top:6px}
#rst.arm{background:linear-gradient(#a04a3a,#6e2e24);border-color:#ff8a7a}
</style>
</head><body>
<div id="app">
 <div id="hud">
  <span class="logo">HEXKEEP</span>
  <span class="rs g" title="Gold"><i data-ic="gold"></i><span class="lb">Gold</span><b id="rg"></b></span><span class="rs w" title="Wood"><i data-ic="wood"></i><span class="lb">Wood</span><b id="rw"></b></span><span class="rs s" title="Stone"><i data-ic="stone"></i><span class="lb">Stone</span><b id="rs"></b></span><span class="rs c" title="Crystal"><i data-ic="crystal"></i><span class="lb">Crystal</span><b id="rc"></b></span>
  <span class="rs h" title="Castle HP"><i data-ic="heart"></i><span class="lb">Castle</span><b id="hp"></b></span><span class="rs wvc" title="Wave"><i data-ic="flag"></i><span class="lb">Wave</span><b id="wv"></b></span>
  <button id="go" class="go"></button><button id="sp">Speed 1x</button><button id="tb">Tech</button><button id="rst" title="Start a new game">Restart</button>
 </div>
 <div id="wrap"><canvas id="c"></canvas><div id="cbtns"><button id="vb">Show built</button><button id="ctr">Center</button></div><div id="legend"></div><div id="menu"></div><div id="tech"></div><div id="intro"></div>
  <div id="over"><h1>Castle fallen</h1><div id="overt" style="font-size:18px"></div><button id="re" class="go">Restart</button></div></div>
 <div id="hint"></div>
</div>
<script>
(function () {
"use strict";
// ===== src/hex.js =====
// Hex grid maths. Axial coordinates (q, r); pointy-top hexes with radius 1 in world space.
const SQ3 = Math.sqrt(3);
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
// Screen-space angle of each of the six neighbour directions (matches DIRS order).
const ANG = [0,-Math.PI/3,-2*Math.PI/3,Math.PI,2*Math.PI/3,Math.PI/3];
const key = (q, r) => q + ',' + r;
// axial -> world position
const W2 = (q, r) => ({ x: SQ3 * (q + r / 2), y: 1.5 * r });
// hex distance from the origin (the castle)
const hd = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
// world position -> nearest hex [q, r]
function worldToHex(wx, wy) {
  const fq = SQ3 / 3 * wx - wy / 3, fr = 2 / 3 * wy;
  let x = fq, z = fr, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}

// ===== src/data/structures.js =====
// Every structure the player can build, one entry per structure.
// This file is plain data: change a number, rebuild (`node tools/build.mjs`), play.
//
//  id             key used in code (must match the object key)
//  name           shown in menus
//  description    tooltip text
//  icon           which drawing to use (see STRUCTURE_ART in src/render/structures.js)
//  cost           { gold, wood, stone, crystal } - omitted resources cost 0
//  hp             structure hit points
//  sight          hexes revealed around it when built
//  allowedTerrain terrains it can be built on
//  --- towers only (a structure with `damage` is a tower) ---
//  range          hexes
//  damage         damage per shot
//  cooldown       seconds between shots (the "fire rate")
//  projectile     { kind: 'arrow' | 'bolt' | 'shell', flight: seconds }; arrows and bolts home in
//  recoilDecay    speed of the firing animation (visual only)
//  splash         { radius } area damage around the impact (radius in world units, hex centres are ~1.73 apart)
//  slow           { duration: seconds, factor: speed multiplier while slowed }
//  terrainBonus   { terrain, damage: multiplier, slowDuration: multiplier } when built on that terrain
//  upgrade        { cost, damageMult, slowDurationMult, text } one upgrade level
//  pierce         true: ignores enemy armor
//  hitsAir        false: cannot target flying enemies (default true)
//  targeting      'first' (closest to the castle, default) or 'priority' (shamans/bosses first,
//                 then the toughest enemy in range)
//  counters       short "good against" line for the build menu
//  --- other ---
//  yield          harvester income per wave, per terrain
//  revealPerWave  scan tower: hexes revealed after every wave
//  blocksPath     drawn as a wall segment (every structure blocks enemies, see src/path.js)
//  pathCost       how reluctant a cut-off enemy is to break through it (default 4)

const ANY = ['plain', 'wood', 'stone', 'crystal'];

const STRUCTURES = {
  scan: {
    id: 'scan', name: 'Scan tower', icon: 'scan',
    description: 'sight 2; reveals 2 hexes each wave',
    cost: { gold: 15 }, hp: 30, sight: 2,
    allowedTerrain: ANY,
    revealPerWave: 2,
  },
  harv: {
    id: 'harv', name: 'Harvester', icon: 'harv',
    description: 'resource hex only, +4/wave (+2 crystal)',
    cost: { gold: 10 }, hp: 35, sight: 1,
    allowedTerrain: ['wood', 'stone', 'crystal'],
    blockedHint: 'wood/stone only',
    yield: { wood: 4, stone: 4, crystal: 2 },
    terrainNote: { crystal: '+2 crystal' },
  },
  archer: {
    id: 'archer', name: 'Archer tower', icon: 'archer',
    description: 'fast, range 5, hits flyers; wood hex +50%',
    counters: 'runners, bats',
    cost: { gold: 10, wood: 5 }, hp: 40, sight: 1,
    allowedTerrain: ANY,
    range: 5, damage: 5, cooldown: 0.45,
    projectile: { kind: 'arrow', flight: 0.18 },
    recoilDecay: 4,
    terrainBonus: { terrain: 'wood', damage: 1.5 },
    upgrade: { cost: { gold: 10, stone: 5 }, damageMult: 1.6, text: '+60% dmg' },
  },
  cat: {
    id: 'cat', name: 'Catapult', icon: 'cat',
    description: 'splash, range 6, ground only; stone hex +50%',
    counters: 'swarms, armor',
    hitsAir: false,
    cost: { gold: 15, stone: 5 }, hp: 40, sight: 1,
    allowedTerrain: ANY,
    range: 6, damage: 14, cooldown: 2.0,
    projectile: { kind: 'shell', flight: 0.7 },
    recoilDecay: 1.5,
    splash: { radius: 1.1 },
    terrainBonus: { terrain: 'stone', damage: 1.5 },
    upgrade: { cost: { gold: 10, stone: 5 }, damageMult: 1.6, text: '+60% dmg' },
  },
  mage: {
    id: 'mage', name: 'Mage tower', icon: 'mage',
    description: 'slows, pierces armor, range 4; crystal hex +50%',
    counters: 'brutes, runners',
    pierce: true,
    cost: { gold: 15, crystal: 4 }, hp: 35, sight: 1,
    allowedTerrain: ANY,
    range: 4, damage: 3, cooldown: 1.1,
    projectile: { kind: 'bolt', flight: 0.3 },
    recoilDecay: 4,
    slow: { duration: 2, factor: 0.5 },
    terrainBonus: { terrain: 'crystal', damage: 1.5, slowDuration: 1.5 },
    upgrade: { cost: { gold: 10, crystal: 3 }, damageMult: 1.6, slowDurationMult: 1.5, text: '+60% dmg, +50% slow' },
  },
  ballista: {
    id: 'ballista', name: 'Ballista', icon: 'ballista',
    description: 'huge range 8, pierces armor, shoots shamans and bosses first',
    counters: 'shamans, bosses',
    cost: { gold: 25, wood: 5, stone: 5 }, hp: 45, sight: 1,
    allowedTerrain: ANY,
    range: 8, damage: 28, cooldown: 2.6, pierce: true, targeting: 'priority',
    projectile: { kind: 'spear', flight: 0.35 },
    recoilDecay: 1.2,
    terrainBonus: { terrain: 'stone', damage: 1.3 },
    upgrade: { cost: { gold: 20, stone: 5 }, damageMult: 1.6, text: '+60% dmg' },
  },
  wall: {
    id: 'wall', name: 'Wall', icon: 'wall',
    description: 'cheap; enemies walk around it. Build a maze!',
    counters: 'all walkers (longer route, more shots)',
    cost: { gold: 2 }, hp: 60, sight: 1,
    allowedTerrain: ANY,
    blocksPath: true, pathCost: 6,
  },
};

// The castle is not buildable, but its numbers live here too.
const CASTLE = { sight: 2, maxHp: 20 };

// Fraction of the paid cost refunded (rounded down per resource) when selling.
const SELL_REFUND = 0.5;

// ===== src/data/terrain.js =====
// Terrain types, map size and map-generation rules.
// Everything here is plain data: edit the numbers, rebuild, play.

const RESOURCES = ['gold', 'wood', 'stone', 'crystal'];

// Hex radius of the whole map (distance from the castle to the edge).
const MAP_RADIUS = 17;

// Order matters: it is used to seed the cached tile art (keep new terrains at the end,
// before 'fog' if you do not want existing tiles to change look).
//   color: [top, bottom] gradient of the tile
//   floatColor: colour of the "+4 wood" floating text when a harvester pays out here
const TERRAINS = {
  plain:   { color: ['#c7bba1', '#a79b82'] },
  wood:    { color: ['#5d8c55', '#3f6a41'], floatColor: '#7fcf6a' },
  stone:   { color: ['#a4a8ae', '#80858d'], floatColor: '#b4bcc8' },
  crystal: { color: ['#3a2c6c', '#241a4a'], floatColor: '#c78bff' },
  castle:  { color: ['#d2c7a4', '#b0a27a'] },
  fog:     { color: ['#141822', '#0b0e15'] },
};

// Map generation. Every hex gets a random roll x in [0,1):
//   1. crystal, if it is at least `minDistance` hexes from the castle, with probability `chance`
//   2. otherwise the first entry of `rolls` whose `below` is greater than x
//   3. otherwise plain
const MAP_GEN = {
  crystal: { minDistance: 6, chance: 0.05 },
  rolls: [
    { terrain: 'wood',  below: 0.15 },
    { terrain: 'stone', below: 0.30 },
  ],
  // Within `radius` hexes of the castle at least one hex of each terrain is guaranteed
  // (a plain hex is converted if none exists).
  guaranteedNearCastle: { radius: 2, terrains: ['wood', 'stone'] },
};

// ===== src/data/tech.js =====
// The tech tree. Three branches of three nodes, each node requires the previous one.
//
// Node fields:
//   id        unique id
//   branch    id of the branch it belongs to
//   name      shown on the tree
//   cost      research points
//   requires  id of the node that must be owned first (or null)
//   txt       effect description shown to the player
//   icon      icon id (see ICONS in src/render/icons.js)
//   effect    parameters read by the engine through tech('key', default). The keys are:
//     harvestBonus   +N to every harvester yield
//     waveGold       +N castle gold per wave
//     costMult       multiplier on all building costs
//     damageMult     multiplier on all tower damage
//     rangeBonus     +N hexes of tower range
//     splashMult     multiplier on splash radius
//     fireRate       { towerId: multiplier } faster fire for those towers
//     sightBonus     +N sight on every building and the castle
//     scanBonus      +N extra hexes revealed by scan towers per wave
//     bountyBonus    +N gold per kill
//     maxHp / heal   castle max HP increase, and immediate healing
// Adding a new effect key needs a line in the engine that reads it; the existing ones
// can be re-assigned to any node freely.

const TECH_BRANCHES = [
  { id: 'eco', name: 'Economy', icon: 'gold' },
  { id: 'def', name: 'Defense', icon: 'sword' },
  { id: 'vis', name: 'Vision',  icon: 'eye' },
];

  { id: 'e1', branch: 'eco', name: 'Deep Veins',       cost: 1, requires: null, icon: 'pick',      txt: 'Harvesters +1 yield',                               effect: { harvestBonus: 1 } },

// Wave pacing, economy and start conditions. Tweak the constants or the small formulas.

// ---- start of a new game
const START_RESOURCES = { gold: 30, wood: 5, stone: 5, crystal: 4 };
const FREE_SCAN_TOWERS = 1;     // first N scan towers are free

// ---- income
const RESEARCH_PER_WAVE = 1;    // tech points earned per wave survived
const WAVE_GOLD_BASE = 10;      // castle income: BASE + wave number (+ tech bonuses)
const waveGold = w => WAVE_GOLD_BASE + w;

// ---- how many enemies, how tough
const waveCount = w => w <= 2 ? w + 2 : w === 3 ? 6 : Math.floor(3 + w * 2);
const HP_PER_WAVE = 0.12;
const HP_PER_WAVE_SQ = 0.01;
const HP_LATE_START = 10;       // after this wave extra scaling kicks in
const HP_LATE_PER_WAVE = 0.07;
const hpMult = w =>
  (1 + HP_PER_WAVE * (w - 1) + HP_PER_WAVE_SQ * (w - 1) * (w - 1)) *
  (1 + HP_LATE_PER_WAVE * Math.max(0, w - HP_LATE_START));

// Early waves are softened: hp multiplier for waves 1..3, then 1.
const EASE_IN = { 1: 0.6, 2: 0.8, 3: 0.9 };
const easeMult = w => EASE_IN[w] === undefined ? 1 : EASE_IN[w];

// Enemy speed grows 1% per wave.
const SPEED_PER_WAVE = 0.01;
const speedMult = w => 1 + SPEED_PER_WAVE * w;

// ---- spawning
const FIRST_SPAWN_DELAY = 0.3;  // seconds before the first enemy
const SPAWN_GAP_START = 1.1;    // seconds between spawns on wave 0 ...
const SPAWN_GAP_PER_WAVE = 0.05; // ... shrinking by this per wave
const SPAWN_GAP_MIN = 0.4;
const spawnGap = w => Math.max(SPAWN_GAP_MIN, SPAWN_GAP_START - SPAWN_GAP_PER_WAVE * w);
const SPAWN_RING_MARGIN = 2;    // enemies spawn this many hexes beyond the revealed area
const SPAWN_ANGLE_STEP = 2.399963; // golden angle: spreads spawns around the castle
const SPAWN_ANGLE_JITTER = 0.5;

// ---- what each wave contains (see waveComposition in src/waves.js)
const BOSS_EVERY = 5;           // a boss closes every 5th wave
const INTRO_RAMP_WAVES = 3;     // a new type reaches its full `share` over this many waves
const INTRO_MIN = 2;            // a type's first wave always has at least this many slots
const SPECIAL_CAP = 0.7;        // at most this share of slots go to non-grunt types
const BOSS_HP_PER_BOSS = 0.5;   // each later boss gets +50% base hp on top of the wave scaling

// ===== src/map.js =====
// Map generation, vision / fog of war and scan-tower revealing.

const rnd = a => a[Math.floor(Math.random() * a.length)];

// Reveal every hex within `rad` of (q0, r0). `flash` is how long the new hex glows.
function reveal(q0, r0, rad, flash) {
 for (let dq = -rad; dq <= rad; dq++) for (let dr = Math.max(-rad, -dq - rad); dr <= Math.min(rad, -dq + rad); dr++) {
  const c = cells.get(key(q0 + dq, r0 + dr)); if (c && !c.revealed) { c.revealed = true; c.newT = flash || 1.5; }
 }
}

function rollTerrain(x) {
 for (const rule of MAP_GEN.rolls) if (x < rule.below) return rule.terrain;
 return 'plain';
}

// Fill `cells` / `cellList` with a fresh random map (nothing revealed yet).
function generateMap() {
 cells.clear(); cellList.length = 0;
 const R = MAP_RADIUS, cry = MAP_GEN.crystal;
 for (let q = -R; q <= R; q++) for (let r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) {
  const x = Math.random();
  const c = { q, r, terrain: (hd(q, r) >= cry.minDistance && Math.random() < cry.chance) ? 'crystal' : rollTerrain(x), revealed: false, b: null, newT: 0 };
  cells.set(key(q, r), c); cellList.push(c);
 }
 // v: tile art variant, nb: the six neighbours (null off the map)
 for (const c of cellList) { c.v = ((c.q * 73 + c.r * 151 + c.q * c.r * 17) & 255) % 4; c.nb = DIRS.map(d => cells.get(key(c.q + d[0], c.r + d[1])) || null); }
 const cc = cells.get('0,0'); cc.terrain = 'castle';
 const g = MAP_GEN.guaranteedNearCastle;
 const near = cellList.filter(c => c !== cc && hd(c.q, c.r) <= g.radius);
 const ensure = t => { if (!near.some(c => c.terrain === t)) { rnd(near.filter(c => c.terrain === 'plain')).terrain = t; } };
 for (const t of g.terrains) ensure(t);
}

// Reveal the `count` nearest hidden hexes around a scan tower's cell (ties broken randomly).
function scanReveal(c, count) {
 const out = [];
 for (let k = 0; k < count; k++) {
  let best = [], bd = 1e9;
  for (const u of cellList) { if (u.revealed) continue; const d = hd(u.q - c.q, u.r - c.r); if (d < bd) { bd = d; best = [u]; } else if (d === bd) best.push(u); }
  if (best.length) { const u = rnd(best); u.revealed = true; u.newT = 2.5; out.push(u); }
 }
 return out;
}

// ===== src/camera.js =====
// Camera and screen layout: world <-> screen conversion, zoom, canvas sizing.

const BASE = 30; // pixels per hex radius at zoom 1
const L = { S: BASE, w: 0, h: 0, dpr: 1 }; // S = current pixels per hex radius
const cam = { x: 0, y: 0, z: 1 };

function updS() { L.S = BASE * cam.z; }
function clampCam() { const m = MAP_RADIUS * SQ3, d = Math.hypot(cam.x, cam.y); if (d > m) { cam.x *= m / d; cam.y *= m / d; } }
function resize() {
 const w = $('wrap'), dpr = window.devicePixelRatio || 1;
 L.w = w.clientWidth; L.h = w.clientHeight; cv.width = L.w * dpr; cv.height = L.h * dpr; L.dpr = dpr; updS();
}
const scr = (x, y) => ({ x: L.w / 2 + (x - cam.x) * L.S, y: L.h / 2 + (y - cam.y) * L.S });
function zoomAt(px, py, f) {
 const wx = cam.x + (px - L.w / 2) / L.S, wy = cam.y + (py - L.h / 2) / L.S;
 cam.z = Math.max(.5, Math.min(2, cam.z * f)); updS();
 cam.x = wx - (px - L.w / 2) / L.S; cam.y = wy - (py - L.h / 2) / L.S; clampCam();
}
// screen pixel -> cell (or null)
function pick(px, py) {
 const wx = cam.x + (px - L.w / 2) / L.S, wy = cam.y + (py - L.h / 2) / L.S;
 const [q, r] = worldToHex(wx, wy);
 return cells.get(key(q, r)) || null;
}

// ===== src/path.js =====
// Enemy pathing and the maze rule. Distance fields are measured from the castle:
//  d1  BFS over open hexes. Every structure blocks it, so enemies walk around your buildings
//      (this is the maze). Enemies follow d1 whenever they stand on an open, connected hex.
//  d2  Dijkstra where structures are passable but expensive (they must break through). Used
//      only by an enemy that is cut off, e.g. one that spawned inside a pocket.
// The maze rule: a build is refused if it would leave no open trail from the map edge to the
// castle (see wouldSeal). One trail in total is enough, so funnelling enemies is allowed.

const blocksPath = c => !!c.b;
const DEFAULT_BREAK_COST = 4;

// Open-hex BFS from the castle. Returns the distance map.
function bfs() {
 const d = new Map(), q = [cells.get('0,0')]; d.set('0,0', 0);
 for (let i = 0; i < q.length; i++) { const c = q[i], dc = d.get(key(c.q, c.r));
  for (const n of c.nb) { if (!n || blocksPath(n)) continue; const k = key(n.q, n.r);
   if (d.has(k)) continue; d.set(k, dc + 1); q.push(n); } }
 return d;
}
const reachesEdge = d => { for (const c of cellList) if (hd(c.q, c.r) === MAP_RADIUS && d.has(key(c.q, c.r))) return true; return false; };

function fields() {
 world.d1 = bfs();
 // wall connection mask (which neighbours are walls too), used only for drawing
 for (const c of cellList) if (c.b && STRUCTURES[c.b.type].blocksPath) { let m = 0; for (let i = 0; i < 6; i++) { const n = c.nb[i]; if (n && n.b && STRUCTURES[n.b.type].blocksPath) m |= 1 << i; } c.b.wm = m; }
 world.d2 = null;
}

// Would putting a structure on cell c cut the castle off from the map edge?
function wouldSeal(c) {
 if (!c || c.b) return false;
 c.b = { type: 'wall' };
 const sealed = !reachesEdge(bfs());
 c.b = null;
 return sealed;
}

function fields2() {
 const d2 = new Map(); world.d2 = d2; cellList.forEach(c => d2.set(key(c.q, c.r), Infinity)); d2.set('0,0', 0);
 const done = new Set();
 for (;;) { let best = null, bd = Infinity;
  for (const c of cellList) { const k = key(c.q, c.r); if (!done.has(k) && d2.get(k) < bd) { bd = d2.get(k); best = c; } }
  if (!best) break; done.add(key(best.q, best.r));
  for (const n of best.nb) { if (!n) continue;
   const cost = n.b ? (STRUCTURES[n.b.type].pathCost || DEFAULT_BREAK_COST) : 1; const k = key(n.q, n.r);
   if (bd + cost < d2.get(k)) d2.set(k, bd + cost); } }
}

// The neighbouring cell an enemy standing on (q, r) should step to next (or null).
function nextStep(q, r) {
 const map = world.d1.has(key(q, r)) ? world.d1 : (world.d2 || (fields2(), world.d2));
 let best = null, bd = Infinity;
 for (const dd of DIRS) { const n = cells.get(key(q + dd[0], r + dd[1])); if (!n) continue;
  const v = map.get(key(n.q, n.r)); if (v !== undefined && v < bd) { bd = v; best = n; } }
 return best;
}

// A few sample routes from the spawn ring to the castle, for drawing the maze in the build phase.
function sampleRoutes(ring, count) {
 const out = [], d1 = world.d1; if (!ring.length) return out;
 for (let i = 0; i < count; i++) {
  let c = ring[Math.floor(i * ring.length / count)]; if (!d1.has(key(c.q, c.r))) continue;
  const route = [c];
  for (let s = 0; s < 400 && !(c.q === 0 && c.r === 0); s++) { c = nextStep(c.q, c.r); if (!c) break; route.push(c); }
  out.push(route);
 }
 return out;
}

// ===== src/waves.js =====
// Wave flow: starting a wave, spawning enemies, and what happens when a wave ends.
// The numbers (how many, how tough, how fast) live in src/data/waves.js and enemies.js.

// What wave w contains: { type: slots }. A slot is one enemy, or one pack for pack enemies.
// New types join on their firstWave and grow to their `share` over INTRO_RAMP_WAVES waves.
function waveComposition(w) {
 const n = waveCount(w), out = {}; let used = 0;
 const specials = Object.values(ENEMIES).filter(T => !T.boss && T.id !== DEFAULT_ENEMY && w >= T.firstWave);
 const want = {}; let sum = 0;
 for (const T of specials) {
  const ramp = Math.min(1, (w - T.firstWave + 1) / INTRO_RAMP_WAVES);
  want[T.id] = Math.max(w === T.firstWave ? INTRO_MIN : 1, n * T.share * ramp); sum += want[T.id];
 }
 const cap = Math.floor(n * SPECIAL_CAP), scale = sum > cap ? cap / sum : 1; // too many specials: shrink them all evenly
 for (const T of specials) { const k = Math.max(1, Math.round(want[T.id] * scale)); out[T.id] = k; used += k; }
 out[DEFAULT_ENEMY] = n - used;
 for (const T of Object.values(ENEMIES)) if (T.boss && w >= T.firstWave && w % BOSS_EVERY === 0) out[T.id] = 1;
 return out;
}
// Enemy types that appear for the first time on wave w.
const newTypes = w => Object.keys(waveComposition(w)).filter(t => ENEMIES[t].firstWave === w);

function startWave() {
 if (st.phase !== 'build' || st.over) return;
 const w = st.wave, comp = waveComposition(w); st.queue = []; const bosses = [];
 for (const t in comp) for (let i = 0; i < comp[t]; i++) (ENEMIES[t].boss ? bosses : st.queue).push(t);
 for (let i = st.queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [st.queue[i], st.queue[j]] = [st.queue[j], st.queue[i]]; }
 st.queue.push(...bosses);
 st.spawnT = FIRST_SPAWN_DELAY; st.spawnN = 0; st.a0 = Math.random() * Math.PI * 2; st.phase = 'wave'; closeMenu(); closeTech(); view.sel = null;
}

// The ring of hexes enemies spawn on: just beyond the revealed area.
function spawnRing() {
 let mr = 0; for (const c of cellList) if (c.revealed) { const d = hd(c.q, c.r); if (d > mr) mr = d; }
 const sd = Math.min(MAP_RADIUS, mr + SPAWN_RING_MARGIN);
 return cellList.filter(c => hd(c.q, c.r) === sd);
}
function spawn(t) {
 const all = spawnRing(), open = all.filter(c => world.d1.has(key(c.q, c.r)));
 const ring = open.length ? open : all;
 const ang = st.a0 + st.spawnN * SPAWN_ANGLE_STEP + (Math.random() - .5) * SPAWN_ANGLE_JITTER; st.spawnN++;
 let c = null, bd = 9;
 for (const u of ring) { const p = W2(u.q, u.r); let d = Math.abs(Math.atan2(Math.sin(Math.atan2(p.y, p.x) - ang), Math.cos(Math.atan2(p.y, p.x) - ang))); if (d < bd) { bd = d; c = u; } }
 const p = W2(c.q, c.r), T = ENEMIES[t], w = st.wave;
 let hp = T.hp * hpMult(w) * easeMult(w);
 if (T.boss) hp *= 1 + BOSS_HP_PER_BOSS * (Math.floor(w / BOSS_EVERY) - 1);
 const n = T.pack || 1, jit = n > 1 ? 0.45 : 0.15;
 for (let i = 0; i < n; i++) {
  const jx = (Math.random() - .5) * 2 * jit, jy = (Math.random() - .5) * 2 * jit;
  st.enemies.push({ t, q: c.q, r: c.r, x: p.x + jx, y: p.y + jy, jx, jy, tq: c.q, tr: c.r, fx: p.x + jx, fy: p.y + jy, p: 0, mode: 'idle', tc: null, acd: 0,
   hp, max: hp, flash: 0, slow: 0, slowF: 1, speed: T.speed * speedMult(w), dmg: T.dmg, fly: !!T.flying, armor: T.armor || 0, hcd: T.heal ? T.heal.every : 0 });
 }
 if (T.boss) { st.banner = { txt: T.name + ' approaches!', t: 0 }; st.shake = .4; }
}
// Called every tick during a wave: releases the next queued enemy when its timer runs out.
function spawnNext(dt) {
 if (st.queue.length) { st.spawnT -= dt; if (st.spawnT <= 0) { spawn(st.queue.shift()); st.spawnT = spawnGap(st.wave); } }
}

function endWave() {
 const bonus = waveGold(st.wave) + tech('waveGold', 0); st.rp += RESEARCH_PER_WAVE;
 const hy = tech('harvestBonus', 0);
 st.gold += bonus; flt(cells.get('0,0'), '+' + bonus + ' gold', '#f1c84b');
 for (const c of cellList) {
  const y = c.b && STRUCTURES[c.b.type].yield && STRUCTURES[c.b.type].yield[c.terrain];
  if (y) { st[c.terrain] += y + hy; flt(c, '+' + (y + hy) + ' ' + c.terrain, TERRAINS[c.terrain].floatColor); }
 }
 for (const c of cellList) {
  const n = c.b && STRUCTURES[c.b.type].revealPerWave;
  if (n) for (const u of scanReveal(c, n + tech('scanBonus', 0))) flt(u, 'revealed', '#8cf');
 }
 st.wave++; st.phase = 'build';
 world.pathDirty = true; showIntro();
}

// ===== src/combat.js =====
// Towers, projectiles, enemy movement / attacks, and the per-tick world update.

const NONE = {};

// ---- tower numbers (all base values come from src/data/structures.js)
function tdmg(c) { const b = c.b, T = STRUCTURES[b.type]; let d = T.damage;
 if (T.terrainBonus && c.terrain === T.terrainBonus.terrain) d *= T.terrainBonus.damage;
 if (b.upg) d *= T.upgrade.damageMult; d *= tech('damageMult', 1); return d; }
const slowDur = c => { const T = STRUCTURES[c.b.type], tb = T.terrainBonus;
 return T.slow.duration * (tb && tb.slowDuration && c.terrain === tb.terrain ? tb.slowDuration : 1) * (c.b.upg ? (T.upgrade.slowDurationMult || 1) : 1); };
const rangeHex = b => STRUCTURES[b.type].range + tech('rangeBonus', 0);
const trange = b => rangeHex(b) * SQ3;
// splash radius of a tower type (or of the first splash tower if none is given)
const splashR = (type) => { const T = type ? STRUCTURES[type] : Object.values(STRUCTURES).find(s => s.splash);
 return T.splash.radius * tech('splashMult', 1); };

// ---- enemies
function decide(e) {
 const best = nextStep(e.q, e.r);
 if (!best) return;
 if (best.b) { e.mode = 'atk'; e.tc = best; e.acd = .3; return; } // only a building on the next step blocks/gets attacked

// ---- one simulation tick
function update(dt) {
 st.time += dt; if (st.flash > 0) st.flash -= dt; if (st.shake > 0) st.shake -= dt;

 for (const f of st.coins) f.t += dt; st.coins = st.coins.filter(f => f.t < f.life);
 for (const c of cellList) { if (c.newT > 0) c.newT -= dt; if (c.b && c.b.flash > 0) c.b.flash -= dt; if (c.b && c.b.fk > 0) c.b.fk = Math.max(0, c.b.fk - dt * STRUCTURES[c.b.type].recoilDecay); }
 if (st.over) return;
 if (world.pathDirty) { fields(); world.routes = sampleRoutes(spawnRing(), 12); world.pathDirty = false; }
 if (st.phase === 'wave') {
  spawnNext(dt);
  for (const e of st.enemies) if (!e.dead) updEnemy(e, dt);
  for (const c of cellList) { const b = c.b; if (!isTower(b)) continue;
   const T = STRUCTURES[b.type];
   b.cd -= dt; if (b.cd > 0) continue;
   const p = W2(c.q, c.r), rg = trange(b), air = T.hitsAir !== false, pri = T.targeting === 'priority'; let tg = null, bd = 1e9;
   for (const e of st.enemies) { if (e.dead || (e.fly && !air)) continue; const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d <= rg) { const cd = pri ? -(ENEMIES[e.t].priority || 0) * 1e5 - e.hp : Math.hypot(e.x, e.y) + (T.slow && e.slow > 0 ? 100 : 0); if (cd < bd) { bd = cd; tg = e; } } }
   if (!tg) continue;
   const pj = T.projectile;
   b.cd = T.cooldown / (tech('fireRate', NONE)[b.type] || 1);
   st.projs.push({ x0: p.x, y0: p.y, x1: tg.x, y1: tg.y, t: 0, dur: pj.flight, dmg: tdmg(c), splash: !!T.splash, splashR: T.splash ? splashR(b.type) : 0, kind: pj.kind, tg,
    slow: T.slow ? slowDur(c) : 0, slowF: T.slow ? T.slow.factor : 1, pierce: !!T.pierce, air });
   b.aim = Math.atan2(tg.y - p.y, tg.x - p.x); b.dx = Math.cos(b.aim) < 0 ? -1 : 1; b.fk = 1;
  }
 }
 for (const pr of st.projs) { pr.t += dt;
  if (pr.kind !== 'shell' && !pr.tg.dead) { pr.x1 = pr.tg.x; pr.y1 = pr.tg.y; }
  if (pr.t >= pr.dur && !pr.done) { pr.done = true;
   if (pr.splash) { for (const e of st.enemies) if (!e.dead && (pr.air || !e.fly) && Math.hypot(e.x - pr.x1, e.y - pr.y1) <= pr.splashR) dmgEnemy(e, pr.dmg, pr.pierce);
    st.floats.push({ x: pr.x1, y: pr.y1, txt: '', ring: 1, col: '#fa6', t: 0, rad: pr.splashR }); st.fx.push({ k: 'dust', x: pr.x1, y: pr.y1, t: 0, life: .55 }); }
   else if (!pr.tg.dead) { if (pr.slow) { pr.tg.slow = Math.max(pr.tg.slow, pr.slow); pr.tg.slowF = pr.slowF; } dmgEnemy(pr.tg, pr.dmg, pr.pierce); } }
 }
 st.projs = st.projs.filter(p => !p.done);
 st.enemies = st.enemies.filter(e => !e.dead);
 if (st.banner) { st.banner.t += dt; if (st.banner.t > 2.5) st.banner = null; }
 st.floats.forEach(f => f.t += dt); st.floats = st.floats.filter(f => f.t < (f.ring ? .35 : 1.4));

}

   ctx.fillStyle='#8a8f98';ctx.strokeStyle='#2a2d33';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s.x,by,rr,0,TAU);ctx.fill();ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(s.x-rr*.3,by-rr*.3,rr*.35,0,TAU);ctx.fill();
   ctx.strokeStyle='rgba(30,30,36,.6)';ctx.beginPath();ctx.moveTo(s.x-rr*.2+Math.cos(p.t*9)*rr*.5,by);ctx.lineTo(s.x+rr*.4,by+rr*.5);ctx.stroke();}}

function drawFx(S){
 for(const f of st.fx){const s=scr(f.x,f.y),k=f.t/f.life;
  if(f.k==='pop'){ctx.strokeStyle=f.col;ctx.globalAlpha=1-k;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(s.x,s.y,S*(.15+.5*k),0,7);ctx.stroke();ctx.globalAlpha=1;}
  else if(f.k==='dust'){
   for(let i=0;i<8;i++){const a=i*.785+.3,d=(.2+.65*Math.sqrt(k))*(i%2?1:.7),r=S*(.1+.17*k);
    ctx.globalAlpha=(1-k)*.6;ctx.fillStyle=i%3?'#b9a88c':'#8f8068';ctx.beginPath();ctx.arc(s.x+Math.cos(a)*d*S,s.y+Math.sin(a)*d*S*.6-k*.25*S,r,0,TAU);ctx.fill();}
   ctx.globalAlpha=1;}
  else if(f.k==='heal'){
   const R=(f.rad||1)*S;ctx.globalCompositeOperation='lighter';
   ctx.globalAlpha=(1-k)*.35;ctx.fillStyle='rgb(60,200,100)';ctx.beginPath();ctx.ellipse(s.x,s.y,R*k,R*k*.6,0,0,TAU);ctx.fill();
   ctx.globalCompositeOperation='source-over';
   ctx.globalAlpha=1-k;ctx.strokeStyle='#7dff9a';ctx.lineWidth=Math.max(2,S*.07);ctx.beginPath();ctx.ellipse(s.x,s.y,R*k,R*k*.6,0,0,TAU);ctx.stroke();
   const a=Math.max(0,1-k*k),ps=S*.12;ctx.fillStyle='#b8ffc8';ctx.strokeStyle='#1d7a3a';ctx.lineWidth=1;
   for(let i=0;i<4;i++){const ang=i*1.57+.5,rr=R*.45*(.5+.5*((i*37%10)/10)),px=s.x+Math.cos(ang)*rr,py=s.y+Math.sin(ang)*rr*.6-k*S*.8-i*S*.05;
    ctx.globalAlpha=a;ctx.beginPath();ctx.rect(px-ps*.3,py-ps,ps*.6,ps*2);ctx.rect(px-ps,py-ps*.3,ps*2,ps*.6);ctx.fill();}
   ctx.globalAlpha=1;}
  else if(f.k==='spark'){
   ctx.globalAlpha=1-k;ctx.lineCap='round';
   for(let i=0;i<6;i++){const a=i*1.05+.4,d0=S*(.06+.1*k),d1=S*(.14+.3*k);
    ctx.strokeStyle=i%2?'#ffffff':'#c8ced6';ctx.lineWidth=i%2?2:1.5;ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*d0,s.y+Math.sin(a)*d0);ctx.lineTo(s.x+Math.cos(a)*d1,s.y+Math.sin(a)*d1);ctx.stroke();}
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,S*.07*(1-k),0,TAU);ctx.fill();
   ctx.globalAlpha=1;}
  else{const q=scr(f.x+f.vx*f.t,f.y+f.vy*f.t);ctx.globalAlpha=1-k;ctx.fillStyle=f.col;ctx.fillRect(q.x-2,q.y-2,4,4);ctx.globalAlpha=1;}}
}
function drawCoins(S){
 if(st.coins.length){const r=cv.getBoundingClientRect(),g=$('rg').getBoundingClientRect(),tx=g.left-r.left+g.width/2,ty=g.top-r.top+g.height/2;
  for(const f of st.coins){const s=scr(f.x,f.y),k=Math.min(1,f.t/f.life),e=k*k;const x=s.x+(tx-s.x)*e,y=s.y+(ty-s.y)*e-Math.sin(k*Math.PI)*20;

 ctx.textAlign='center';ctx.font='bold '+Math.max(11,S*.4)+'px system-ui';

  ctx.globalAlpha=Math.max(0,1-f.t/1.4);ctx.fillStyle='#000';ctx.fillText(f.txt,s.x+1,s.y-f.t*S*.6+1);ctx.fillStyle=f.col;ctx.fillText(f.txt,s.x,s.y-f.t*S*.6);ctx.globalAlpha=1;}

// ===== src/render/scene.js =====
// Draws one frame: tiles and fog, structures, range rings, enemies, then the effect layers.

function hexPath(x,y,s){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);const px=x+s*Math.cos(a),py=y+s*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function bar(x,y,w,f,col){
 const h=Math.max(3,.1*L.S);
 ctx.fillStyle='rgba(10,10,16,.88)';ctx.fillRect(x-w/2-1,y-1,w+2,h+2);
 ctx.fillStyle='#3a1a1a';ctx.fillRect(x-w/2,y,w,h);
 f=Math.max(0,f);ctx.fillStyle=f>.6?'#5fd35f':f>.3?'#e8c840':'#e85a4a';ctx.fillRect(x-w/2,y,w*f,h);
 ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x-w/2,y,w*f,Math.max(1,h*.3));
}
// rim colour of a built hex, by kind (see the legend in the "Show built" toggle)
const PLATE={tower:'#ff8a4a',wall:'#cfc6b4',harv:'#8fe06a',scan:'#6ab8ff'};
function plateColor(b){const T=STRUCTURES[b.type];return T.damage?PLATE.tower:T.blocksPath?PLATE.wall:T.yield?PLATE.harv:PLATE.scan;}
const edges=[],blist=[];
function draw(){
 const S=L.S;ctx.setTransform(L.dpr,0,0,L.dpr,0,0);setG(ctx);setNOW(performance.now()/1000);setLW(lwu(S));
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,L.w,L.h);
 if(st.shake>0){const m=Math.min(6,st.shake*20);ctx.translate((Math.random()-.5)*2*m,(Math.random()-.5)*2*m);}
 const mg=S*1.2;
 const vis=(s)=>s.x>-mg&&s.x<L.w+mg&&s.y>-mg&&s.y<L.h+mg;
 edges.length=0;blist.length=0;
 const hot=[];
 for(const c of cellList){
  const p=W2(c.q,c.r),s=scr(p.x,p.y);
  if(!vis(s))continue;
  let t;
  if(!c.revealed)t=tileFor('fog',c.v,0,S);
  else{t=tileFor(c.terrain,c.v,c.terrain==='castle'?0:c.b?2:1,S);
   for(let i=0;i<6;i++){const n=c.nb[i];if(n&&!n.revealed)edges.push(s.x,s.y,i);}
   if(c.newT>0)hot.push(s.x,s.y,c.newT);
   if(c.b||c.terrain==='castle')blist.push(c);
   else if(c.terrain==='crystal'){const gl=.1+.07*Math.sin(NOW*2.5+c.q+c.r*2);ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(150,110,255,'+gl+')';ctx.beginPath();ctx.arc(s.x,s.y,S*.55,0,TAU);ctx.fill();
    const tw=Math.max(0,Math.sin(NOW*3+c.q*2.1+c.r));ctx.fillStyle='rgba(255,255,255,'+tw*.9+')';const sx=s.x+S*.22,sy=s.y-S*.3,r=S*.09*tw;ctx.fillRect(sx-r,sy-.8,r*2,1.6);ctx.fillRect(sx-.8,sy-r,1.6,r*2);ctx.globalCompositeOperation='source-over';}
  }
  const dp=L.dpr;ctx.drawImage(t.cv,Math.round((s.x-t.half)*dp)/dp,Math.round((s.y-t.half)*dp)/dp,t.w,t.w);
 }
 // soft fog edge
 if(edges.length){
  for(const [lw,al] of [[.34,.12],[.16,.22]]){
   ctx.beginPath();
   for(let j=0;j<edges.length;j+=3){const a=ANG[edges[j+2]],a0=a-Math.PI/6,a1=a+Math.PI/6,r=S*.94;
    ctx.moveTo(edges[j]+Math.cos(a0)*r,edges[j+1]+Math.sin(a0)*r);ctx.lineTo(edges[j]+Math.cos(a1)*r,edges[j+1]+Math.sin(a1)*r);}
   ctx.strokeStyle='rgba(4,6,12,'+al*2+')';ctx.lineWidth=S*lw;ctx.lineCap='butt';ctx.stroke();}
 }
 for(let j=0;j<hot.length;j+=3){hexPath(hot[j],hot[j+1],S*.94);ctx.strokeStyle='rgba(255,255,255,'+Math.min(1,hot[j+2])+')';ctx.lineWidth=3;ctx.stroke();}
 // enemy routes (the maze) during the build phase: dotted lines from the spawn ring to the castle
 if(st.phase==='build'&&world.routes){
  ctx.save();ctx.setLineDash([S*.12,S*.22]);ctx.lineDashOffset=-NOW*S*.6;ctx.lineCap='round';ctx.lineJoin='round';
  for(const [w,col] of [[S*.16,'rgba(0,0,0,.35)'],[S*.07,'rgba(255,120,90,.75)']]){ctx.lineWidth=w;ctx.strokeStyle=col;
   for(const rt of world.routes){ctx.beginPath();rt.forEach((c,i)=>{const p=W2(c.q,c.r),s=scr(p.x,p.y);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);});ctx.stroke();}}
  ctx.restore();
 }
 // built hexes: a dark foundation plate with a rim coloured by kind, so built vs empty is obvious.
 // With "Show built" on, every empty hex is dimmed as well.
 if(view.showBuilt){ctx.fillStyle='rgba(6,8,14,.62)';
  for(const c of cellList){if(!c.revealed||c.b||c.terrain==='castle')continue;const p=W2(c.q,c.r),s=scr(p.x,p.y);if(!vis(s))continue;hexPath(s.x,s.y,S*.97);ctx.fill();}}
 for(const c of blist){if(!c.b)continue;const p=W2(c.q,c.r),s=scr(p.x,p.y);
  hexPath(s.x,s.y,S*.9);ctx.fillStyle='rgba(20,26,40,.42)';ctx.fill();
  hexPath(s.x,s.y,S*.86);ctx.strokeStyle=plateColor(c.b);ctx.lineWidth=Math.max(2,S*(view.showBuilt?.13:.08));ctx.stroke();}
 // buildings (back to front)
 blist.sort((a,b)=>a.r-b.r);
 for(const c of blist){const b=c.b,p=W2(c.q,c.r),s=scr(p.x,p.y);
  ctx.save();ctx.translate(s.x,s.y);ctx.scale(S,S);
  if(!b)dCastle(S);else drawBuilding(b.type,c.terrain,b,S,b.wm||0);
  ctx.restore();
  if(b&&b.hp<b.max)bar(s.x,s.y+.62*S,.9*S,b.hp/b.max);
 }
 // range
 const rc=view.sel||view.hover;
 if(rc&&isTower(rc.b)){const p=W2(rc.q,rc.r),s=scr(p.x,p.y);
  ctx.beginPath();ctx.arc(s.x,s.y,trange(rc.b)*S,0,7);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();}
 if(rc){const p=W2(rc.q,rc.r),s=scr(p.x,p.y);hexPath(s.x,s.y,S*.95);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
 // enemies
 const es=st.enemies.slice().sort((a,b)=>a.y-b.y);
 for(const e of es){const T=ENEMIES[e.t],s=scr(e.x,e.y);
  if(!vis(s))continue;
  dEnemy(e,s,S);
  if(e.hp<e.max)ebar(s.x,s.y-T.barOffset*S-.14*S,.6*S,e.hp/e.max,'#e55');}
 drawProjectiles(S);
 // castle hit flash
 if(st.flash>0){const s=scr(0,0);hexPath(s.x,s.y,S*.95);ctx.fillStyle='rgba(255,50,50,'+Math.min(.6,st.flash*2)+')';ctx.fill();}
 drawFx(S);
 drawCoins(S);
 drawFloats(S);
 if(st.banner){const b=st.banner,a=Math.min(1,b.t*3,(2.5-b.t)*2);ctx.globalAlpha=Math.max(0,a);ctx.textAlign='center';ctx.font='900 '+Math.max(22,Math.min(44,L.w*.06))+'px system-ui';
  ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(b.txt,L.w/2,L.h*.2);ctx.fillStyle='#ff6a4a';ctx.fillText(b.txt,L.w/2,L.h*.2);ctx.globalAlpha=1;}
}

function openMenu(c,px,py){

 if(!c.b){
  t.textContent='Hex: '+c.terrain;
  const seals=wouldSeal(c);
  if(seals){const d=document.createElement('div');d.className='t warn';d.textContent='Building here would seal the castle off. Enemies always need one open route.';m.appendChild(d);}
  for(const k of Object.keys(STRUCTURES)){

   const allowed=T.allowedTerrain.includes(c.terrain);
   let dis=!free&&!afford(k);if(!allowed||seals)dis=true;
   let sub=null;
   if(seals)sub=['would seal the castle',1];
   else if(!allowed)sub=[T.blockedHint||'not on this hex',1];

   else if(T.terrainBonus&&T.terrainBonus.terrain===c.terrain)sub=['+'+Math.round((T.terrainBonus.damage-1)*100)+'% on this hex'+(T.counters?'; good vs '+T.counters:'')];
   else if(T.counters)sub=['good vs '+T.counters,2];
   const ic='b:'+k+':'+(allowed?c.terrain:T.allowedTerrain[0]);

  }
 }else{

}

 if(!st.over&&st.phase==='build')html='<span class="nx">Next wave'+(st.wave%BOSS_EVERY===0?' <b class="bs">BOSS</b>':'')+': '+preview(st.wave)+'</span>'+html;
 const kk=h+'|'+st.wave+st.phase;
 if(hud.k!==kk){hud.k=kk;$('hint').innerHTML=html;$('hint').querySelector('.ht').textContent=h;}
}

// ===== src/state.js =====
// Game state and the economy: resources, building / selling / upgrading, tech purchase.
// `st` is the single mutable game-state object (reset in place by newGame, never replaced).

const st = {};                 // game state (see newGame for the fields)
const cells = new Map();       // 'q,r' -> cell
const cellList = [];           // every cell, in generation order
const world = { d1: new Map(), d2: null, pathDirty: true }; // path fields, see path.js
const view = { sel: null, hover: null };                     // selected / hovered cell

// ---- tech helpers
const has = id => !!(st && st.tech && st.tech[id]);
// Value of an effect parameter from the first owned tech node that defines it, else `def`.
function tech(effectKey, def) {
 for (const n of TECH_NODES) if (has(n.id) && n.effect && effectKey in n.effect) return n.effect[effectKey];
 return def;
}
const sightOf = t => (t === 'castle' ? CASTLE.sight : STRUCTURES[t].sight) + tech('sightBonus', 0);
const isTower = b => !!(b && STRUCTURES[b.type].damage > 0);

function newGame() {
 generateMap();
 reveal(0, 0, CASTLE.sight, 0);
 for (const k of Object.keys(st)) delete st[k];
 Object.assign(st, { gold: START_RESOURCES.gold, wood: START_RESOURCES.wood, stone: START_RESOURCES.stone, crystal: START_RESOURCES.crystal,
  rp: 0, tech: {}, maxhp: CASTLE.maxHp, shake: 0, fx: [], coins: [], hp: CASTLE.maxHp, wave: 1, phase: 'build', freeScan: FREE_SCAN_TOWERS,
  enemies: [], projs: [], seen: {}, banner: null, floats: [], queue: [], spawnT: 0, a0: 0, spawnN: 0, speed: 1, over: false, flash: 0, time: 0 });
 view.sel = null; view.hover = null; closeMenu(); closeTech(); $('over').style.display = 'none';
 cam.x = 0; cam.y = 0; cam.z = 1; world.pathDirty = true; updS();
 showIntro();
}

// ---- costs
function costOf(t) { const T = STRUCTURES[t], k = tech('costMult', 1), o = {};
 for (const r of RESOURCES) o[r] = T.cost[r] ? Math.max(1, Math.round(T.cost[r] * k)) : 0; return o; }
function canPay(o) { return st.gold >= (o.gold || 0) && st.wood >= (o.wood || 0) && st.stone >= (o.stone || 0) && st.crystal >= (o.crystal || 0); }
function pay(o) { st.gold -= o.gold || 0; st.wood -= o.wood || 0; st.stone -= o.stone || 0; st.crystal -= o.crystal || 0; }
function afford(t) { return canPay(costOf(t)); }
function fmt(o) { const a = []; if (o.gold) a.push(o.gold + 'g'); if (o.wood) a.push(o.wood + 'w'); if (o.stone) a.push(o.stone + 's'); if (o.crystal) a.push(o.crystal + 'c'); return a.join(' ') || 'free'; }
function costStr(t) { return fmt(costOf(t)); }
function refundOf(s) {
 return { gold: Math.floor(s.gold * SELL_REFUND), wood: Math.floor(s.wood * SELL_REFUND), stone: Math.floor(s.stone * SELL_REFUND), crystal: Math.floor((s.crystal || 0) * SELL_REFUND) };
}

function flt(c, txt, col) { const p = W2(c.q, c.r); st.floats.push({ x: p.x, y: p.y, txt, col, t: 0 }); }

// ---- actions
function build(c, t) {
 if (st.phase !== 'build' || st.over) return false;
 if (!c || !c.revealed || c.b || c.terrain === 'castle') return false;
 const T = STRUCTURES[t];
 if (!T.allowedTerrain.includes(c.terrain)) return false;
 if (wouldSeal(c)) { flt(c, 'would seal the castle!', '#f88'); return false; }
 let free = false;
 if (t === 'scan' && st.freeScan > 0) free = true; else if (!afford(t)) return false;
 const sp = { gold: 0, wood: 0, stone: 0, crystal: 0 };
 if (!free) { const co = costOf(t); pay(co); Object.assign(sp, co); }
 else st.freeScan--;
 c.b = { type: t, hp: T.hp, max: T.hp, upg: 0, cd: .3, flash: 0, spent: sp, q0: c.q * 1.7 + c.r * .9 };
 reveal(c.q, c.r, sightOf(t), 1.5);
 world.pathDirty = true;
 return true;
}
function sell(c) {
 if (st.phase !== 'build' || !c.b) return;
 const { gold: g, wood: w, stone: sn, crystal: cr } = refundOf(c.b.spent);
 st.gold += g; st.wood += w; st.stone += sn; st.crystal += cr;
 flt(c, 'sold +' + g + 'g' + (w ? ' +' + w + 'w' : '') + (sn ? ' +' + sn + 's' : '') + (cr ? ' +' + cr + 'c' : ''), '#fff'); c.b = null; world.pathDirty = true; }
function upgrade(c) { const b = c.b;
 if (st.phase !== 'build' || !b || b.upg || !isTower(b) || !canPay(STRUCTURES[b.type].upgrade.cost)) return false;
 const u = STRUCTURES[b.type].upgrade.cost; pay(u); for (const k in u) b.spent[k] = (b.spent[k] || 0) + u[k]; b.upg = 1; return true; }

function gameOver() { st.over = true; st.phase = 'over'; $('overt').textContent = 'Waves survived: ' + (st.wave - 1); $('over').style.display = 'flex'; closeMenu(); }

// ---- tech tree
const techNode = id => TECH_NODES.find(n => n.id === id) || null;
function techState(id) { const n = techNode(id); if (has(id)) return 'own'; if (n.requires && !has(n.requires)) return 'lock'; return st.rp >= n.cost ? 'av' : 'poor'; }
function buyTech(id) {
 if (st.phase !== 'build' || st.over) return false; const n = techNode(id); if (!n) return false;
 const s = techState(id); if (s !== 'av') return false;
 st.rp -= n.cost; st.tech[id] = 1;
 const ef = n.effect || {};
 if (ef.sightBonus) { reveal(0, 0, sightOf('castle'), 1.5); for (const c of cellList) if (c.b) reveal(c.q, c.r, sightOf(c.b.type), 1.5); }
 if (ef.maxHp) { st.maxhp += ef.maxHp; st.hp = Math.min(st.maxhp, st.hp + (ef.heal || 0)); }
 renderTech(); return true;
}

// ===== src/input.js =====
// Pointer input: tap to select / build, drag to pan, wheel and pinch to zoom.

function ptr(ev){const r=cv.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top};}
const ptrs=new Map(); let moved=false, lastPinch=0;
const TAP_PX=8;
function endPtr(ev,cancel){
 const e=ptrs.get(ev.pointerId);if(!e)return;
 const p=ptr(ev);const wasSingle=ptrs.size===1;
 ptrs.delete(ev.pointerId);
 for(const o of ptrs.values()){o.sx=o.x;o.sy=o.y;}
 if(wasSingle&&!moved&&!cancel)tap(p.x,p.y,e.type);
}
function tap(px,py,type){
 if(st.over)return;const c=pick(px,py);
 view.hover=type==='mouse'?c:null;
 if(!c||!c.revealed||c.terrain==='castle'){view.sel=null;closeMenu();return;}
 if(st.phase!=='build'){closeMenu();view.sel=c;return;} // wave: only show range
 view.sel=c;openMenu(c,px,py);
}

// Attach the pointer / wheel / resize listeners (called once from main.js).
function initInput(){
cv.addEventListener('pointerdown',ev=>{
 ev.preventDefault();const p=ptr(ev);
 try{cv.setPointerCapture(ev.pointerId);}catch(e){}
 ptrs.set(ev.pointerId,{x:p.x,y:p.y,sx:p.x,sy:p.y,type:ev.pointerType});
 if(ptrs.size===1)moved=false;
 else{moved=true;closeMenu();const a=[...ptrs.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
});
cv.addEventListener('pointermove',ev=>{
 const p=ptr(ev);const e=ptrs.get(ev.pointerId);
 if(ev.pointerType==='mouse'&&!e)view.hover=pick(p.x,p.y);
 if(!e)return;
 if(ptrs.size===1){
  if(!moved&&Math.hypot(p.x-e.sx,p.y-e.sy)>TAP_PX){moved=true;closeMenu();e.x=e.sx;e.y=e.sy;}
  if(moved){cam.x-=(p.x-e.x)/L.S;cam.y-=(p.y-e.y)/L.S;clampCam();view.hover=null;}
  e.x=p.x;e.y=p.y;
 }else if(ptrs.size===2){
  const a=[...ptrs.values()];const o=a[0]===e?a[1]:a[0];
  const mx0=(e.x+o.x)/2,my0=(e.y+o.y)/2;
  e.x=p.x;e.y=p.y;
  const mx=(e.x+o.x)/2,my=(e.y+o.y)/2,dist=Math.hypot(e.x-o.x,e.y-o.y)||1;
  cam.x-=(mx-mx0)/L.S;cam.y-=(my-my0)/L.S;
  zoomAt(mx,my,dist/lastPinch);lastPinch=dist;
 }
});
cv.addEventListener('pointerup',ev=>endPtr(ev,false));
cv.addEventListener('pointercancel',ev=>endPtr(ev,true));
cv.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')view.hover=null;});
cv.addEventListener('wheel',ev=>{ev.preventDefault();const p=ptr(ev);zoomAt(p.x,p.y,Math.exp(-ev.deltaY*.0015));},{passive:false});
window.addEventListener('resize',resize);
}

// ===== src/main.js =====
// Entry point: boots the game, runs the frame loop and exposes `window.game` for debugging/tests.

let last = performance.now();
function frame(t) {
 let dt = Math.min(.1, (t - last) / 1000) * st.speed; last = t;
 try { const n = Math.max(1, Math.ceil(dt / .033)); for (let i = 0; i < n; i++) update(dt / n); draw(); hud(); } catch (e) { console.error(e); }
 requestAnimationFrame(frame);
}

bindUI(); initInput();
newGame(); resize(); document.querySelectorAll('[data-ic]').forEach(e => e.appendChild(icoEl(e.dataset.ic, 20))); requestAnimationFrame(frame);

window.game = { st: () => st, cells: () => cells, cam: () => cam, build: (q, r, t) => build(cells.get(key(q, r)), t), upgrade: (q, r) => upgrade(cells.get(key(q, r))),
 sell: (q, r) => sell(cells.get(key(q, r))), start: startWave,
 step: (sec) => { const n = Math.ceil(sec / .033); for (let i = 0; i < n; i++) update(sec / n); },
 screen: (q, r) => { const p = W2(q, r), s = scr(p.x, p.y), b = cv.getBoundingClientRect(); return { x: b.left + s.x, y: b.top + s.y }; },
 spawnRing, waveCount, hpMult, waveComposition, world: () => world, newGame, buyTech, openTech, closeTech, has, costOf, techState, tdmg: (q, r) => tdmg(cells.get(key(q, r))), rangeHex: (q, r) => rangeHex(cells.get(key(q, r)).b), TECH };

})();
</script></body></html>
